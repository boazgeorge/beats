<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worship Metronome</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 40px;
  background: white;
}
#beat {
  font-size: 150px;
  font-weight: bold;
  margin-top: 40px;
}
button {
  font-size: 22px;
  padding: 12px 26px;
  margin: 10px;
}
#tempo {
  font-size: 26px;
  margin-top: 20px;
}
</style>
</head>
<body>

<h1>Worship Metronome</h1>

<div>
  <button onclick="setSignature(4)">4/4</button>
  <button onclick="setSignature(3)">3/4</button>
  <button onclick="setSignature(6)">6/8</button>
</div>

<div>
  <label>Tempo: </label>
  <input type="number" id="bpm" value="80" min="40" max="200" style="font-size:22px;width:90px;">
</div>

<button onclick="startClick()">START</button>
<button onclick="stopClick()">STOP</button>

<div id="beat"></div>

<script>
let interval;
let signature = 4;
let count = 1;
let countdownBar = 1; // 1-bar then final bar
let mode = "countdown";

function setSignature(sig) {
  signature = sig;
}

function startClick() {
  stopClick();
  const bpm = document.getElementById("bpm").value;
  const ms = (60 / bpm) * 1000;

  count = 1;
  countdownBar = 1;
  mode = "countdown";

  document.getElementById("beat").innerText = "READY";

  setTimeout(() => {
    interval = setInterval(tick, ms);
  }, 800);
}

function stopClick() {
  clearInterval(interval);
  document.getElementById("beat").innerText = "";
}

function tick() {
  if (mode === "countdown") {
    document.getElementById("beat").innerText = count;

    if (count === signature) {
      if (countdownBar === 1) {
        countdownBar = 2;
        count = 1;
        return;
      } else {
        // SWITCH TO NORMAL METRONOME
        mode = "normal";
        count = 1;
        document.getElementById("beat").innerText = "1";
        return;
      }
    }
    count++;
  } 
  else {
    // NORMAL METRONOME LOOP
    document.getElementById("beat").innerText = count;
    count++;
    if (count > signature) count = 1;
  }
}
</script>

</body>
</html>
